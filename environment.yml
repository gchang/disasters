name: disasters
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal=3.12
  - libgdal=3.12
  - numpy
  - asf_search
  - beautifulsoup4
  - boto3
  - click
  - earthaccess
  - fiona
  - geopandas
  - jupyterlab
  - leafmap
  - lxml
  - matplotlib
  - opera-utils=0.25.3
  - osmnx
  - pandas
  - pip
  - pygmt
  # GMT build 7 is the newest GMT 6.6.0 built against GDAL 3.12. Newer GMT builds need
  # GDAL 3.13, which the gdal pin above rules out, and without this line the solver
  # spends a very long time backtracking before it finds a compatible GMT.
  - gmt=6.6.0=*_7
  - rasterio
  - rioxarray<0.20.0
  - tabulate
  - xarray
  - zarr
  - openpyxl
  - pre-commit

  - pip:
      - git+https://github.com/OPERA-Cal-Val/next_pass.git@main
